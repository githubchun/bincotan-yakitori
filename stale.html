<!doctype html><meta charset="utf-8"><title>stale-store recovery</title>
<style>body{margin:0;background:#111;color:#eee;font:13px/1.6 monospace}
.l{padding:5px 12px;border-bottom:1px solid #262626}.ok{color:#6ee787}.bad{color:#ff7b72;font-weight:700}
.h{color:#e8a33d;padding:10px 12px;font-weight:700}
iframe{position:absolute;left:-9999px;width:1100px;height:800px}</style>
<div id="o"></div>
<script>
const o=document.getElementById('o');let fails=0,n=0;
const log=(ok,m)=>{n++;o.insertAdjacentHTML('beforeend',`<div class="l ${ok?'ok':'bad'}">${ok?'✓':'✗'} ${m}</div>`);if(!ok)fails++;};
const head=m=>o.insertAdjacentHTML('beforeend',`<div class="h">${m}</div>`);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// Exactly what a returning visitor still has: the pre-refactor shape.
const OLD_V2 = { seq:433, seededOn:'2026-08-25', blocked:['2026-09-08'],
  bookings:[{ id:'BY-0421', name:'Rachel Tan', phone:'+65 8234 5678', date:'2026-09-03',
    time:'19:00', pax:12, hours:4, status:'menu', addr:'42 Jalan Kayu', depositClaimed:false,
    notes:'', chicken:['liver'], veg:['asparagus'], addons:{} }] };
// A v3-keyed record that is corrupt in a different way.
const BAD_V3 = { seq:1, blocked:[], bookings:[{ id:'X', date:'2026-01-01' }] };

async function load(label, seed){
  head(label);
  seed();
  const f=document.createElement('iframe'); f.src='index.html?t='+Math.random();
  document.body.appendChild(f);
  await new Promise(r=>{ f.onload=r; });
  await wait(1300);
  const d=f.contentDocument, txt=(d.body.innerText||'').trim();
  log(txt.length>200, `renders ${txt.length} chars (blank page = 0)`);
  log(/Yakitori is/.test(txt), 'hero copy is present');
  log(!/didn.t load/i.test(txt), 'no crash screen needed');
  f.remove();
}

(async()=>{
  await load('1 · stale pre-refactor store under the OLD key', ()=>{
    localStorage.setItem('bincotan.store.v2', JSON.stringify(OLD_V2));
    localStorage.removeItem('bincotan.store.v3');
  });
  await load('2 · corrupt record under the CURRENT key', ()=>{
    localStorage.setItem('bincotan.store.v3', JSON.stringify(BAD_V3));
  });
  await load('3 · outright garbage under the current key', ()=>{
    localStorage.setItem('bincotan.store.v3', 'not json at all');
  });
  await load('4 · clean first visit', ()=>{
    localStorage.removeItem('bincotan.store.v2');
    localStorage.removeItem('bincotan.store.v3');
  });
  o.insertAdjacentHTML('beforeend',`<div class="l ${fails?'bad':'ok'}" style="font-size:16px;padding:12px">
    ${fails?fails+' FAILED of '+n:'ALL '+n+' PASSED'}</div>`);
})();
</script>
